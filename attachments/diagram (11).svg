    <text x="550.5" y="333" class="header-text" text-anchor="middle" dominant-baseline="central">Zero-Trust Security Gateway</text>
    <text x="550.5" y="355" class="header-text" text-anchor="middle" dominant-baseline="central">(Staff mod triggers &amp; compliance)</text>
  </g>
