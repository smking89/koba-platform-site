    <text x="550.5" y="179" class="header-text" text-anchor="middle" dominant-baseline="central">(Live telemetry pairing loops)</text>
  </g>
  <g class="shape outer cluster">
    <rect x="15" y="212" width="314.5" height="88" rx="0" ry="0" class="outer-box"/>
    <text x="168" y="245" class="header-text" text-anchor="middle" dominant-baseline="central">Multi-Action Heavy Ranker Weights</text>
    <text x="168" y="267" class="header-text" text-anchor="middle" dominant-baseline="central">(Combines probability variables)</text>
  </g>
  <g class="shape outer cluster">
    <rect x="397.5" y="212" width="314.5" height="88" rx="0" ry="0" class="outer-box"/>
    <text x="550.5" y="245" class="header-text" text-anchor="middle" dominant-baseline="central">10-Minute Boost Ingress Pipeline</text>
    <text x="550.5" y="267" class="header-text" text-anchor="middle" dominant-baseline="central">(Injects 3x visibility weight)</text>
  </g>
  <g class="shape outer cluster">
    <rect x="15" y="300" width="314.5" height="88" rx="0" ry="0" class="outer-box"/>
    <text x="168" y="333" class="header-text" text-anchor="middle" dominant-baseline="central">Isolated Visibility Filtering</text>
    <text x="168" y="355" class="header-text" text-anchor="middle" dominant-baseline="central">(Allows/Drops content cleanly)</text>
  </g>
