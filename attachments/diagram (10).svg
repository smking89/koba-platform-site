<svg class="dark " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650.5 415" width="650.5" height="415">
  <style>:root, .light {
    --_lm: ;
    --_dm: initial;
    --bg: #ffffff;
    --fg: #1f1f1f;
    --line: #545454;
    --accent: #1a73e8;
    --surface: #f8f9fa;
    --border: #747775;
  }

  .dark {
    --_lm: initial;
    --_dm: ;
    --bg: #1f1f1f;
    --fg: #e3e3e3;
    --line: #bfbfbf;
    --accent: #8ab4f8;
    --surface: #2d2e30;
    --border: #8e918f;
  }
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Google Sans Mono', sans-serif; }
  svg {
    --_text:          var(--primaryTextColor, var(--fg));
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--lineColor, var(--defaultLinkColor, var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)))));
    --_arrow:         var(--_line);
    --_node-fill:     var(--primaryColor, var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg))));
    --_node-stroke:   var(--primaryBorderColor, var(--nodeBorder, var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)))));
    --_group-fill:    var(--surface, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  var(--_node-stroke);
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }</style>
  <defs>
    <style>text { font-family: "Google Sans Mono", monospace; font-size: 13px; dominant-baseline: central; white-space: pre; }
.outer-box { fill: color-mix(in srgb, var(--fg) 6%, transparent); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.75px; }
.rect-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; }
.stadium-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; }
.hex-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round; }
.diamond-box { fill: color-mix(in srgb, var(--fg) 9%, transparent); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round; }
.header-text { font-size: 14px; font-weight: 600; fill: var(--_text); }
.label-text { font-size: 13px; font-weight: 500; fill: var(--_text); }
.annotation-text { font-size: 12px; font-weight: 500; fill: var(--_text); }
.arrow-line, .bus-line { stroke: var(--_line); stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.divider-line { stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.0px; stroke-opacity: 0.75; }</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="var(--_arrow)"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="var(--_arrow)"/>
    </marker>
  </defs>
  <g class="shape outer cluster">
    <rect x="253" y="37" width="127.5" height="66" rx="0" ry="0" class="outer-box"/>
    <text x="312.5" y="70" class="header-text" text-anchor="middle" dominant-baseline="central">koba.games</text>
  </g>
  <g class="shape outer cluster">
    <rect x="15" y="169" width="178.5" height="220" rx="0" ry="0" class="outer-box"/>
    <line x1="15" y1="213" x2="193.5" y2="213" class="divider-line"/>
    <text x="100" y="191" class="header-text" text-anchor="middle" dominant-baseline="central">koba.games</text>
    <text x="100" y="235" class="label-text" text-anchor="middle" dominant-baseline="central">(Public Portal)</text>
    <text x="100" y="257" class="label-text" text-anchor="middle" dominant-baseline="central">• Player Profiles</text>
    <text x="100" y="279" class="label-text" text-anchor="middle" dominant-baseline="central">• Clan Spaces</text>
    <text x="100" y="301" class="label-text" text-anchor="middle" dominant-baseline="central">• Server Discovery</text>
    <text x="100" y="323" class="label-text" text-anchor="middle" dominant-baseline="central">• Astro Hub</text>
    <text x="100" y="345" class="label-text" text-anchor="middle" dominant-baseline="central">• B2B / Dashboards</text>
    <text x="100" y="367" class="label-text" text-anchor="middle" dominant-baseline="central">(WebRCON/Spons)</text>
  </g>
  <g class="shape outer cluster">
    <rect x="457" y="169" width="178.5" height="220" rx="0" ry="0" class="outer-box"/>
    <line x1="457" y1="213" x2="635.5" y2="213" class="divider-line"/>
    <text x="542" y="191" class="header-text" text-anchor="middle" dominant-baseline="central">admin.koba.games</text>
    <text x="542" y="246" class="label-text" text-anchor="middle" dominant-baseline="central">(INTERNAL STAFF)</text>
    <text x="542" y="268" class="label-text" text-anchor="middle" dominant-baseline="central">• SuperAdmin Core</text>
    <text x="542" y="290" class="label-text" text-anchor="middle" dominant-baseline="central">• Operations Floor</text>
    <text x="542" y="312" class="label-text" text-anchor="middle" dominant-baseline="central">• Mod Escalations</text>
    <text x="542" y="334" class="label-text" text-anchor="middle" dominant-baseline="central">• Global Overrides</text>
  </g>
  <line x1="95.75" y1="136" x2="537.75" y2="136" class="bus-line"/>
  <line x1="193.5" y1="180" x2="457" y2="180" class="bus-line"/>
  <line x1="240.25" y1="224" x2="410.25" y2="224" class="bus-line"/>
  <line x1="240.25" y1="400" x2="410.25" y2="400" class="bus-line"/>
  <line x1="95.75" y1="136" x2="95.75" y2="167" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="240.25" y1="180" x2="240.25" y2="400" class="bus-line"/>
  <line x1="316.75" y1="103" x2="316.75" y2="178" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="350.75" y1="37" x2="350.75" y2="17" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="410.25" y1="224" x2="410.25" y2="400" class="bus-line"/>
  <line x1="537.75" y1="136" x2="537.75" y2="167" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="389" y="70" class="annotation-text" text-anchor="start" dominant-baseline="central">(Global Ingress Edge)</text>
  <text x="244.5" y="202" class="annotation-text" text-anchor="start" dominant-baseline="central">developers.koba.games</text>
  <text x="253" y="246" class="annotation-text" text-anchor="start" dominant-baseline="central">(Developer Hub)</text>
  <text x="270" y="268" class="annotation-text" text-anchor="start" dominant-baseline="central">API &amp; SDK Docs</text>
  <text x="270" y="290" class="annotation-text" text-anchor="start" dominant-baseline="central">Webhook Guides</text>
  <text x="270" y="312" class="annotation-text" text-anchor="start" dominant-baseline="central">Ingestion Endpt</text>
  <text x="270" y="334" class="annotation-text" text-anchor="start" dominant-baseline="central">Token Self-Mgmt</text>
</svg>
